<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPocket - ระบบจัดการเงิน 3 บัญชี & ค่าจัดฟัน</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone for JSX parsing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f8fafc;
        }
        .font-cute {
            font-family: 'Prompt', sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .cute-card {
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03);
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-pink-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Account definitions for the 3 main banks
        const ACCOUNTS = {
            KTB: { 
                id: 'KTB', 
                name: 'กรุงไทย - เงินหมุนเวียน/ใช้จ่าย', 
                shortName: 'กรุงไทย', 
                color: 'bg-gradient-to-r from-sky-400 to-cyan-500', 
                badgeColor: 'bg-sky-100 text-sky-800 border-sky-200',
                textColor: 'text-sky-600',
                desc: 'เงินใช้จ่ายทั่วไป / แม่โอนให้ / ค่าจัดฟัน'
            },
            BBL: { 
                id: 'BBL', 
                name: 'กรุงเทพ (ใช้จ่ายประจำวัน)', 
                shortName: 'กรุงเทพ', 
                color: 'bg-gradient-to-r from-indigo-600 to-blue-500', 
                badgeColor: 'bg-indigo-100 text-indigo-800 border-indigo-200',
                textColor: 'text-indigo-600',
                desc: 'งบใช้จ่ายสัปดาห์ละ 750 บาท'
            },
            GSB: { 
                id: 'GSB', 
                name: 'ออมสิน (เงินเก็บฉุกเฉิน)', 
                shortName: 'ออมสิน', 
                color: 'bg-gradient-to-r from-pink-400 to-rose-400', 
                badgeColor: 'bg-pink-100 text-pink-800 border-pink-200',
                textColor: 'text-pink-600',
                desc: 'ออมยาวๆ ห้ามถอนมั่ว'
            }
        };

        // Weekly Budget Categories (750 THB Total Target)
        const WEEKLY_BUDGET_RULES = {
            fuel: { id: 'fuel', name: 'ค่าน้ำมันรถ', target: 120, icon: '⛽', catName: 'ค่าน้ำมันรถ' },
            lunch: { id: 'lunch', name: 'ข้าวเที่ยง มหาลัย', target: 250, icon: '🍱', catName: 'ข้าวเที่ยง มหาลัย' },
            groceries: { id: 'groceries', name: 'ซื้อของทำกับข้าว', target: 300, icon: '🛒', catName: 'ซื้อของทำกับข้าว' },
            savings: { id: 'savings', name: 'เงินเก็บประจำสัปดาห์', target: 80, icon: '🐷', catName: 'เงินเก็บประจำสัปดาห์' }
        };

        const initialTransactions = [];

        const WalletLogo = () => (
            <div className="w-11 h-11 flex-shrink-0">
                <svg viewBox="0 0 200 200" className="w-full h-full drop-shadow-sm" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 42 125 C 28 92 40 58 68 45" stroke="#A8D8C8" strokeWidth="9" strokeLinecap="round" />
                    <path d="M 78 168 C 122 182 160 152 165 110" stroke="#A8D8C8" strokeWidth="9" strokeLinecap="round" />
                    <path d="M 68 33 C 68 42 62 47 54 47 C 62 47 68 52 68 61 C 68 52 74 47 82 47 C 74 47 68 42 68 33 Z" fill="#F7C138" />
                    <rect x="126" y="68" width="10" height="15" rx="3" fill="#41987F" />
                    <rect x="141" y="56" width="10" height="27" rx="3" fill="#41987F" />
                    <rect x="156" y="45" width="10" height="38" rx="3" fill="#41987F" />
                    <path d="M 121 62 C 136 48 149 38 159 33" stroke="#41987F" strokeWidth="7" strokeLinecap="round" fill="none" />
                    <path d="M 147 31 L 162 32 L 158 45" fill="#41987F" stroke="#41987F" strokeWidth="2" strokeLinejoin="round" />
                    <rect x="54" y="58" width="46" height="42" rx="6" fill="#2B6B58" transform="rotate(-16 54 58)" />
                    <rect x="64" y="53" width="46" height="42" rx="6" fill="#4CA88B" transform="rotate(-6 64 53)" />
                    <circle cx="100" cy="78" r="24" fill="#F7C138" stroke="#E1A123" strokeWidth="3" />
                    <text x="100" y="86" textAnchor="middle" fill="#FFFFFF" fontSize="23" fontWeight="800" fontFamily="Prompt, sans-serif">฿</text>
                    <rect x="52" y="92" width="96" height="64" rx="18" fill="#3D8E77" />
                    <rect x="52" y="92" width="96" height="18" rx="9" fill="#4DA389" />
                    <line x1="58" y1="112" x2="82" y2="112" stroke="#68BD9F" strokeWidth="4" strokeLinecap="round" />
                    <rect x="110" y="108" width="38" height="28" rx="12" fill="#2A6956" />
                    <circle cx="125" cy="122" r="5" fill="#FFFFFF" />
                </svg>
            </div>
        );

        const Icons = {
            Home: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>,
            Plus: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.8} d="M12 4v16m8-8H4" /></svg>,
            List: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.2} d="M4 6h16M4 10h16M4 14h16M4 18h16" /></svg>,
            Edit: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
            Search: () => <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
            ChevronRight: () => <svg className="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>,
            Close: () => <svg className="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M6 18L18 6M6 6l12 12" /></svg>
        };

        function Modal({ isOpen, onClose, onConfirm, title, message, confirmText = "ตกลง", cancelText = "ยกเลิก", isDanger = false }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-fadeIn">
                    <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-pink-100 text-center">
                        <div className="w-12 h-12 rounded-full bg-pink-100 text-pink-500 flex items-center justify-center mx-auto mb-3 text-xl">
                            ✨
                        </div>
                        <h3 className="text-base font-bold text-slate-800 mb-1">{title}</h3>
                        <p className="text-xs text-slate-500 mb-6 leading-relaxed">{message}</p>
                        <div className="flex space-x-2">
                            <button
                                onClick={onClose}
                                className="flex-1 py-2.5 px-3 rounded-2xl border border-slate-200 text-slate-600 font-medium text-xs hover:bg-slate-50"
                            >
                                {cancelText}
                            </button>
                            <button
                                onClick={() => { onConfirm(); onClose(); }}
                                className={`flex-1 py-2.5 px-3 rounded-2xl font-semibold text-xs text-white shadow-md active:scale-95 transition-all ${
                                    isDanger ? 'bg-rose-500 hover:bg-rose-600' : 'bg-sky-500 hover:bg-sky-600'
                                }`}
                            >
                                {confirmText}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            // Main transactions state persisted to localStorage
            const [transactions, setTransactions] = useState(() => {
                try {
                    const saved = localStorage.getItem('mypocket_cute_txs_v3');
                    return saved !== null ? JSON.parse(saved) : initialTransactions;
                } catch (e) {
                    return initialTransactions;
                }
            });

            // Target budget for dental care
            const [dentalBaseBudget, setDentalBaseBudget] = useState(() => {
                try {
                    const saved = localStorage.getItem('mypocket_dental_budget_v2');
                    return saved ? parseFloat(saved) : 1500;
                } catch (e) { return 1500; }
            });

            const [isEditingDentalBudget, setIsEditingDentalBudget] = useState(false);
            const [tempDentalBudget, setTempDentalBudget] = useState('');

            const [activeTab, setActiveTab] = useState('dashboard');
            const [selectedMonth, setSelectedMonth] = useState('ALL');
            const [searchQuery, setSearchQuery] = useState('');
            const [editingId, setEditingId] = useState(null);
            const [errorMsg, setErrorMsg] = useState('');

            // Active modal state for interactive cards
            const [activeModal, setActiveModal] = useState(null);

            const [modalConfig, setModalConfig] = useState({ isOpen: false, title: '', message: '', onConfirm: () => {}, isDanger: false });

            // Form state for general transaction adding
            const [formData, setFormData] = useState({
                type: 'expense',
                account: 'BBL',
                fromAccount: 'KTB',
                toAccount: 'BBL',
                amount: '',
                category: 'ข้าวเที่ยง มหาลัย',
                date: new Date().toISOString().split('T')[0],
                note: ''
            });

            // Quick modal form state
            const [quickForm, setQuickForm] = useState({
                amount: '',
                note: '',
                type: 'expense',
                account: 'BBL',
                date: new Date().toISOString().split('T')[0]
            });

            useEffect(() => {
                localStorage.setItem('mypocket_cute_txs_v3', JSON.stringify(transactions));
            }, [transactions]);

            useEffect(() => {
                localStorage.setItem('mypocket_dental_budget_v2', dentalBaseBudget.toString());
            }, [dentalBaseBudget]);

            const resetForm = () => {
                setFormData({
                    type: 'expense',
                    account: 'BBL',
                    fromAccount: 'KTB',
                    toAccount: 'BBL',
                    amount: '',
                    category: 'ข้าวเที่ยง มหาลัย',
                    date: new Date().toISOString().split('T')[0],
                    note: ''
                });
                setEditingId(null);
                setErrorMsg('');
            };

            const handleSaveTransaction = (e) => {
                if (e) e.preventDefault();
                const amt = parseFloat(formData.amount);
                if (!formData.amount || isNaN(amt) || amt <= 0) {
                    setErrorMsg('กรุณากรอกจำนวนเงินให้ถูกต้องค่ะ');
                    return;
                }

                if (formData.type === 'transfer' && formData.fromAccount === formData.toAccount) {
                    setErrorMsg('บัญชีต้นทางและปลายทางต้องไม่เหมือนกันค่ะ');
                    return;
                }

                if (editingId) {
                    setTransactions(prev => prev.map(t => t.id === editingId ? {
                        ...t,
                        type: formData.type,
                        account: formData.account,
                        fromAccount: formData.fromAccount,
                        toAccount: formData.toAccount,
                        amount: amt,
                        category: formData.category,
                        date: formData.date,
                        note: formData.note
                    } : t));
                } else {
                    const newTx = {
                        id: Date.now().toString(),
                        type: formData.type,
                        account: formData.account,
                        fromAccount: formData.fromAccount,
                        toAccount: formData.toAccount,
                        amount: amt,
                        category: formData.category,
                        date: formData.date,
                        note: formData.note
                    };
                    setTransactions(prev => [newTx, ...prev]);
                }

                resetForm();
                setActiveTab('history');
            };

            const handleEditTransaction = (tx) => {
                setEditingId(tx.id);
                setFormData({
                    type: tx.type || 'expense',
                    account: tx.account || 'BBL',
                    fromAccount: tx.fromAccount || 'KTB',
                    toAccount: tx.toAccount || 'BBL',
                    amount: tx.amount.toString(),
                    category: tx.category || 'อื่นๆ',
                    date: tx.date || new Date().toISOString().split('T')[0],
                    note: tx.note || ''
                });
                setActiveModal(null);
                setActiveTab('add');
            };

            const handleDeleteTransaction = (id) => {
                setModalConfig({
                    isOpen: true,
                    title: 'ยืนยันการลบรายการ',
                    message: 'คุณต้องการลบรายการนี้ใช่ไหม? การกระทำนี้ไม่สามารถย้อนกลับได้ค่ะ',
                    confirmText: 'ลบรายการ',
                    isDanger: true,
                    onConfirm: () => {
                        setTransactions(prev => prev.filter(t => t.id !== id));
                    }
                });
            };

            // Calculate account balances and category breakdown
            const { balances, weeklySpent, heldFundsTotal, dentalSpentTotal, dentalAddedTotal } = useMemo(() => {
                let bal = { KTB: 0, BBL: 0, GSB: 0, Total: 0 };
                let wSpent = { fuel: 0, lunch: 0, groceries: 0, savings: 0, total: 0 };
                let heldTotal = 0;
                let dSpent = 0;
                let dAdded = 0;

                transactions.forEach(t => {
                    const amt = parseFloat(t.amount) || 0;
                    const cat = t.category || '';

                    // 1. Bank Balances calculation
                    if (cat === 'เงินเก็บประจำสัปดาห์') {
                        const sourceAcc = t.fromAccount || t.account || 'BBL';
                        bal[sourceAcc] = (bal[sourceAcc] || 0) - amt;
                        bal['GSB'] = (bal['GSB'] || 0) + amt;

                        wSpent.savings += amt;
                        wSpent.total += amt;
                    } else if (t.type === 'income') {
                        bal[t.account] = (bal[t.account] || 0) + amt;
                    } else if (t.type === 'expense') {
                        bal[t.account] = (bal[t.account] || 0) - amt;
                    } else if (t.type === 'transfer') {
                        const fromAcc = t.fromAccount || 'KTB';
                        const toAcc = t.toAccount || 'BBL';
                        bal[fromAcc] = (bal[fromAcc] || 0) - amt;
                        bal[toAcc] = (bal[toAcc] || 0) + amt;
                    }

                    // 2. Weekly Budget Breakdown
                    if (t.type === 'expense') {
                        if (cat === 'ค่าน้ำมันรถ') wSpent.fuel += amt;
                        else if (cat === 'ข้าวเที่ยง มหาลัย') wSpent.lunch += amt;
                        else if (cat === 'ซื้อของทำกับข้าว') wSpent.groceries += amt;

                        if (['ค่าน้ำมันรถ', 'ข้าวเที่ยง มหาลัย', 'ซื้อของทำกับข้าว'].includes(cat)) {
                            wSpent.total += amt;
                        }
                    }

                    // 3. Held Funds calculation ("เงินคนอื่นฝากไว้")
                    if (cat === 'เงินคนอื่นฝากไว้') {
                        if (t.type === 'income') heldTotal += amt;
                        else if (t.type === 'expense') heldTotal -= amt;
                    } else if (cat === 'คืนเงินฝากคนอื่น') {
                        if (t.type === 'expense') heldTotal -= amt;
                        else if (t.type === 'income') heldTotal += amt;
                    }

                    // 4. Dental Funds calculation ("ค่าจัดฟัน 🦷")
                    if (cat.includes('จัดฟัน')) {
                        if (t.type === 'expense') dSpent += amt;
                        else if (t.type === 'income') dAdded += amt;
                    }
                });

                bal.Total = (bal.KTB || 0) + (bal.BBL || 0) + (bal.GSB || 0);

                return { 
                    balances: bal, 
                    weeklySpent: wSpent, 
                    heldFundsTotal: heldTotal, 
                    dentalSpentTotal: dSpent,
                    dentalAddedTotal: dAdded
                };
            }, [transactions]);

            const formatMoney = (amount) => {
                return new Intl.NumberFormat('th-TH', { 
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 2 
                }).format(amount || 0) + ' ฿';
            };

            const handleAddQuickTransaction = (overrideData) => {
                const amt = parseFloat(overrideData.amount || quickForm.amount);
                if (isNaN(amt) || amt <= 0) {
                    alert('กรุณากรอกจำนวนเงินให้ถูกต้องค่ะ');
                    return;
                }

                const catName = overrideData.category || quickForm.category;
                const isSavings = catName === 'เงินเก็บประจำสัปดาห์';

                const newTx = {
                    id: Date.now().toString(),
                    type: isSavings ? 'transfer' : (overrideData.type || quickForm.type),
                    account: overrideData.account || quickForm.account,
                    fromAccount: overrideData.account || quickForm.account || 'BBL',
                    toAccount: isSavings ? 'GSB' : (overrideData.toAccount || quickForm.toAccount || 'BBL'),
                    amount: amt,
                    category: catName,
                    date: overrideData.date || quickForm.date || new Date().toISOString().split('T')[0],
                    note: overrideData.note || quickForm.note || ''
                };

                setTransactions(prev => [newTx, ...prev]);
                setQuickForm({
                    amount: '',
                    note: '',
                    type: 'expense',
                    account: 'BBL',
                    date: new Date().toISOString().split('T')[0]
                });
            };

            const renderDashboard = () => {
                const weeklyBudgetTotal = 750;
                const remainingWeeklyBudget = Math.max(0, weeklyBudgetTotal - weeklySpent.total);
                const accountDisplayOrder = ['KTB', 'BBL', 'GSB'];

                const currentDentalReserve = Math.max(0, (dentalBaseBudget + dentalAddedTotal) - dentalSpentTotal);

                return (
                    <div className="space-y-5 pb-24 animate-fadeIn">
                        {/* 1. Bank Balances Summary */}
                        <div className="space-y-3">
                            <div className="flex justify-between items-center px-1">
                                <h3 className="text-sm font-bold text-slate-800 font-cute">สรุปยอด 3 บัญชีหลัก</h3>
                                <span className="text-xs font-semibold text-slate-500">รวมทั้งหมด: {formatMoney(balances.Total)}</span>
                            </div>
                            {accountDisplayOrder.map(accKey => {
                                const acc = ACCOUNTS[accKey];
                                if (!acc) return null;
                                return (
                                    <div 
                                        key={accKey} 
                                        onClick={() => setActiveModal({ type: 'account', key: accKey })}
                                        className={`${acc.color} rounded-2xl p-4 text-white shadow-sm flex justify-between items-center transition-all cursor-pointer hover:shadow-md active:scale-[0.99] group`}
                                    >
                                        <div>
                                            <div className="flex items-center space-x-2">
                                                <span className="text-xs font-bold tracking-wider bg-white/20 px-2.5 py-0.5 rounded-md">{acc.shortName}</span>
                                                <span className="text-[11px] opacity-90">{acc.desc}</span>
                                            </div>
                                            <p className="text-xl font-extrabold mt-1 tracking-tight">{formatMoney(balances[accKey])}</p>
                                        </div>
                                        <div className="opacity-70 group-hover:opacity-100 group-hover:translate-x-1 transition-all">
                                            <Icons.ChevronRight />
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        {/* 2. TARGET: Weekly Spending Checklist (750 THB) */}
                        <div className="bg-white rounded-3xl p-5 border border-indigo-100 cute-card">
                            <div className="flex justify-between items-center mb-3">
                                <div>
                                    <h3 className="text-sm font-bold text-slate-800 font-cute">งบสัปดาห์นี้ (บัญชีกรุงเทพ)</h3>
                                    <p className="text-[11px] text-slate-400">โอนสัปดาห์ละ 750 บาท • แตะที่รายการเพื่อเปิดดู/บันทึก</p>
                                </div>
                                <div className="text-right">
                                    <span className="text-[10px] text-slate-400 block">คงเหลือสัปดาห์นี้</span>
                                    <span className="text-base font-extrabold text-indigo-600">{formatMoney(remainingWeeklyBudget)}</span>
                                </div>
                            </div>

                            <div className="space-y-2.5 pt-1">
                                {Object.values(WEEKLY_BUDGET_RULES).map(rule => {
                                    const spent = weeklySpent[rule.id] || 0;
                                    const isOver = spent > rule.target;
                                    const pct = Math.min(100, Math.round((spent / rule.target) * 100));

                                    return (
                                        <div 
                                            key={rule.id} 
                                            onClick={() => setActiveModal({ type: 'weekly', key: rule.id })}
                                            className="bg-slate-50 p-3 rounded-2xl border border-slate-100 cursor-pointer hover:bg-slate-100/80 hover:border-indigo-200 transition-all active:scale-[0.99]"
                                        >
                                            <div className="flex justify-between items-center text-xs mb-1">
                                                <span className="font-semibold text-slate-700">{rule.icon} {rule.name}</span>
                                                <div className="flex items-center space-x-1">
                                                    <span className={isOver ? 'text-rose-500 font-bold' : 'text-slate-600 font-medium'}>

                                                                </button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col justify-between relative shadow-2xl bg-slate-50">
                    <header className="bg-white/80 backdrop-blur-md sticky top-0 z-30 px-5 py-3 border-b border-emerald-100 flex justify-between items-center">
                        <div className="flex items-center space-x-2.5">
                            <WalletLogo />
                            <div>
                                <h1 className="text-sm font-bold text-slate-800 font-cute">MyPocket</h1>
                                <p className="text-[10px] text-slate-400">ระบบจัดการเงิน 3 บัญชีหลัก</p>
                            </div>
                        </div>
                    </header>

                    <main className="p-4 flex-1">
                        {activeTab === 'dashboard' && renderDashboard()}
                        {activeTab === 'history' && renderHistory()}
                        {activeTab === 'add' && renderAddForm()}
                    </main>

                    {renderDetailModal()}

                    <Modal 
                        isOpen={modalConfig.isOpen}
                        onClose={() => setModalConfig(prev => ({ ...prev, isOpen: false }))}
                        onConfirm={modalConfig.onConfirm}
                        title={modalConfig.title}
                        message={modalConfig.message}
                        confirmText={modalConfig.confirmText}
                        isDanger={modalConfig.isDanger}
                    />

                    <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/90 backdrop-blur-md border-t border-slate-100 max-w-md mx-auto pb-safe">
                        <div className="flex justify-around items-center h-16 px-4">
                            <button
                                onClick={() => setActiveTab('dashboard')}
                                className={`flex flex-col items-center justify-center flex-1 h-full space-y-0.5 transition-colors ${
                                    activeTab === 'dashboard' ? 'text-emerald-600 font-bold' : 'text-slate-400'
                                }`}
                            >
                                <Icons.Home />
                                <span className="text-[10px]">หน้าหลัก</span>
                            </button>

                            <button
                                onClick={() => { resetForm(); setActiveTab('add'); }}
                                className="flex flex-col items-center justify-center -mt-6"
                            >
                                <div className="w-12 h-12 rounded-full bg-gradient-to-r from-emerald-500 to-teal-600 text-white flex items-center justify-center shadow-lg shadow-emerald-200 transform active:scale-95 transition-transform">
                                    <Icons.Plus />
                                </div>
                            </button>

                            <button
                                onClick={() => setActiveTab('history')}
                                className={`flex flex-col items-center justify-center flex-1 h-full space-y-0.5 transition-colors ${
                                    activeTab === 'history' ? 'text-emerald-600 font-bold' : 'text-slate-400'
                                }`}
                            >
                                <Icons.List />
                                <span className="text-[10px]">ประวัติ</span>
                            </button>
                        </div>
                    </nav>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
